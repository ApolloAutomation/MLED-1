name: Apollo MLED-1 installer Pages

# Publishes the web installer for one release: index.html, firmware/manifest.json and
# firmware/MLED-1_full_install.bin taken from that release, plus NOTICE and LICENSE.
# Called by the build workflow after a release; run it by hand to redeploy.
on:
  workflow_call:
    inputs:
      tag:
        description: Release tag to publish
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish (empty for the latest release)
        required: false
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    concurrency:
      group: apollo-mled1-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Resolve release tag
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          if [ -z "$TAG" ]; then
            TAG="$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName)"
          fi
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "not a release tag: $TAG"; exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
      # Page and manifest come from the released commit
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ steps.tag.outputs.tag }}
      - name: Stage site
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          version="${TAG#v}"
          if [ "$version" != "$(jq -r .version package.json)" ]; then
            echo "$TAG does not match package.json at that tag"; exit 1
          fi
          mkdir -p _site/firmware
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern 'MLED-1_full_install.bin' --pattern 'SHA256SUMS.txt' --dir _site/firmware
          (cd _site/firmware && grep ' MLED-1_full_install.bin$' SHA256SUMS.txt | sha256sum -c - && rm SHA256SUMS.txt)
          jq --arg v "$version" '.version = $v' apollo/installer/manifest.json > _site/firmware/manifest.json
          sed -e "s/@VERSION@/$version/g" -e "s/@TAG@/$TAG/g" apollo/installer/index.html > _site/index.html
          if grep -q '@[A-Z]*@' _site/index.html; then echo "unfilled placeholder in index.html"; exit 1; fi
          cp NOTICE _site/NOTICE.txt
          cp LICENSE _site/LICENSE.txt
          find _site -type f -exec ls -l {} +
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v5
