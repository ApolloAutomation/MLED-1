name: Apollo MLED-1 build

# Builds the apollo_mled1 env on main and PRs into it.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: apollo-mled1-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - run: npm ci
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - run: pip install -r requirements.txt
      - name: Build apollo_mled1
        run: pio run -e apollo_mled1
      - name: Check factory defaults are in the binary
        run: |
          bin=.pio/build/apollo_mled1/firmware.bin
          grep -a -q -F 'Apollo MLED-1 Hotspot' "$bin"
          ! grep -a -q -F 'wled1234' "$bin"
      - name: Resolved libraries
        run: pio pkg list -e apollo_mled1
      - uses: actions/upload-artifact@v4
        with:
          name: apollo_mled1-${{ github.sha }}
          retention-days: 90
          path: |
            .pio/build/apollo_mled1/firmware.bin
            .pio/build/apollo_mled1/firmware.elf
            .pio/build/apollo_mled1/firmware.map
            .pio/build/apollo_mled1/bootloader.bin
            .pio/build/apollo_mled1/partitions.bin
